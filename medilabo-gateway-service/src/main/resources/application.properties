############################
# Server
############################
server.port=8080
spring.application.name=medilabo-gateway-service

############################
# Spring Cloud Gateway
############################

# ---- Demographics / Patient Service ----
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=http://demographics-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**

# ---- Notes Service ----
spring.cloud.gateway.routes[1].id=notes-service
spring.cloud.gateway.routes[1].uri=http://notes-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notes/**

# ---- Risk Service ----
spring.cloud.gateway.routes[2].id=risk-service
spring.cloud.gateway.routes[2].uri=http://risk-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/risk/**

# ---- Auth Service ----
spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=http://auth-service:9000
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**

# ---- React UI (nginx inside container runs on port 80) ----
spring.cloud.gateway.routes[4].id=ui-service
spring.cloud.gateway.routes[4].uri=http://ui-service:80
spring.cloud.gateway.routes[4].predicates[0]=Path=/**

############################
# CORS
############################
spring.webflux.cors.enabled=true

############################
# JWT Resource Server
############################
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem

############################
# Security (customize as needed)
############################
# By default, all /api/** except /api/auth/** require authentication
# UI (/**) is public
