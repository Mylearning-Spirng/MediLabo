# ===============================
# Server
# ===============================
server.port=8080
spring.application.name=gateway-service

# ===============================
# Gateway Routes
# ===============================
# Auth service (JWT issuing)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:9000
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Patient service (CRUD)
# ? FIX: patient-service is running on 8081 (you confirmed with curl)
spring.cloud.gateway.routes[1].id=patient-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/patients/**

# Notes service
spring.cloud.gateway.routes[2].id=notes-service
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notes/**

# Risk service
spring.cloud.gateway.routes[3].id=risk-service
spring.cloud.gateway.routes[3].uri=http://localhost:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/risk/**

# ===============================
# Global CORS (ONLY in gateway)
# ===============================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
# ? Prefer explicit headers for JWT
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.corsConfigurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ===============================
# Safety: Remove duplicate headers
# ===============================
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# ===============================
# NOTE
# ===============================
# ? Gateway does NOT need its own JWT secret unless you are validating JWT in gateway.
# Keep JWT validation inside each microservice (patient/notes/risk).