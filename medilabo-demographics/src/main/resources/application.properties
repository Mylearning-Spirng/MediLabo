spring.application.name=medilabo
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/diabetesdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.show-sql=true
server.port=8081
spring.security.oauth2.resourceserver.jwt.public-key-location=file:/Users/madhurijampana/MediLabo/keys/public.pem

