spring.application.name=medilabo

# =========================
# Server
# =========================
server.port=8081

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
# (Optional) Remove explicit dialect warning - Hibernate detects it automatically
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Datasource (Docker-friendly)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/diabetesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# =========================
# Security (JWT public key)
# Put public.pem in src/main/resources/
# =========================
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem


# Run schema/data scripts on startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# (Optional but helpful)
spring.jpa.defer-datasource-initialization=true